name: FailPack replay

on:
  push:
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FailPack
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Replay all golden packs
        run: |
          set -euo pipefail
          failpack list
          for pack in .failpack/packs/*/meta.json; do
            id="$(basename "$(dirname "$pack")")"
            status="$(python -c "import json; print(json.load(open('$pack'))['status'])")"
            if [ "$status" = "golden" ]; then
              echo "::group::replay $id"
              failpack replay "$id"
              echo "::endgroup::"
            fi
          done
