name: FailPack replay

on:
  push:
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dogfood the reusable composite action (local install of this repo).
      - uses: ./.github/actions/failpack-replay
        with:
          install-from: "."
          run-doctor: "true"

      - name: Unit tests
        run: pytest -q
