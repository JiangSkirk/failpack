name: FailPack replay

on:
  push:
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FailPack
        run: pip install -e ".[dev]"

      - name: Doctor
        run: failpack doctor

      - name: Unit tests
        run: pytest -q

      - name: Replay all golden packs
        run: |
          failpack list
          failpack replay --all
