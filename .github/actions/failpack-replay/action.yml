name: FailPack replay
description: Install FailPack and replay golden packs (failpack replay --all)
branding:
  icon: shield
  color: red

inputs:
  root:
    description: Project root containing .failpack/ (default checkout root)
    required: false
    default: "."
  python-version:
    description: Python version for setup-python
    required: false
    default: "3.12"
  install-from:
    description: >
      How to install FailPack. Use "." for the current repo (editable), or a
      git URL such as "git+https://github.com/JiangSkirk/failpack.git".
    required: false
    default: "git+https://github.com/JiangSkirk/failpack.git"
  extra-pip-args:
    description: Extra args passed to pip install (e.g. quotes around extras)
    required: false
    default: ""
  run-doctor:
    description: Run failpack doctor --score before replay (advisory; exits 0)
    required: false
    default: "true"
  json:
    description: Emit machine-readable JSON from replay
    required: false
    default: "false"
  step-summary:
    description: Write markdown replay report to $GITHUB_STEP_SUMMARY
    required: false
    default: "true"
  run-lint:
    description: Run failpack lint before replay
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install FailPack
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        set -euo pipefail
        if [[ "${{ inputs.install-from }}" == "." ]]; then
          pip install ${{ inputs.extra-pip-args }} -e ".[dev]"
        else
          pip install ${{ inputs.extra-pip-args }} "${{ inputs.install-from }}"
        fi

    - name: Doctor
      if: inputs.run-doctor == 'true'
      shell: bash
      working-directory: ${{ inputs.root }}
      # Advisory: doctor exits 0 unless --strict; --score prints readiness 0–100
      run: failpack doctor --score

    - name: Lint packs
      if: inputs.run-lint == 'true'
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        NO_COLOR: "1"
      run: failpack lint

    - name: Replay golden packs
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        NO_COLOR: "1"
      run: |
        set -euo pipefail
        failpack list
        if [[ "${{ inputs.json }}" == "true" ]]; then
          failpack replay --all --json
        else
          failpack replay --all
        fi

    - name: Step summary
      if: always() && inputs.step-summary == 'true'
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        NO_COLOR: "1"
      # continue-on-error: report exits 1 on FAIL; replay step already owns the signal
      continue-on-error: true
      run: failpack report --github
