[project]
name = "failpack"
version = "1.0.0"
description = "Turn coding-agent failure sessions into golden CI regression packs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FailPack" }]
keywords = ["ci", "regression", "coding-agent", "golden-pack"]
dependencies = [
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/JiangSkirk/failpack"
Repository = "https://github.com/JiangSkirk/failpack"
Issues = "https://github.com/JiangSkirk/failpack/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
failpack = "failpack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/failpack"]

[tool.hatch.build.targets.wheel.force-include]
"src/failpack/data/demo-failure.jsonl" = "failpack/data/demo-failure.jsonl"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]
