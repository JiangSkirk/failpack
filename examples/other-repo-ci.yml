# Example: use FailPack's composite action from another repository.
#
# Copy this file to .github/workflows/failpack.yml in a repo that vendors
# (or syncs) golden packs under .failpack/packs/.
#
# Prefer a release tag (stable CLI). @main is an alternative that tracks tip.
#
#   uses: JiangSkirk/failpack/.github/actions/failpack-replay@v1.1.0
#   uses: JiangSkirk/failpack/.github/actions/failpack-replay@main

name: FailPack regression replay

on:
  push:
  pull_request:

jobs:
  failpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install FailPack from GitHub and replay every golden pack.
      # Defaults: run-lint=true, step-summary=true (failpack report --github),
      # run-doctor=true.
      - uses: JiangSkirk/failpack/.github/actions/failpack-replay@v1.1.0
        with:
          # Optional overrides:
          # python-version: "3.12"
          # install-from: "git+https://github.com/JiangSkirk/failpack.git"
          # run-doctor: "true"
          # run-lint: "true"          # failpack lint before replay (default)
          # step-summary: "true"      # job summary via failpack report --github
          # json: "false"
